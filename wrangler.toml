name = "posiki"
main = "worker.js"
compatibility_date = "2025-01-01"

[[routes]]
pattern = "posiki.com"
custom_domain = true

[[routes]]
pattern = "www.posiki.com"
custom_domain = true

[[routes]]
pattern = "eyeday.posiki.com"
custom_domain = true

[assets]
directory = "."
binding = "ASSETS"
# 호스트명 분기를 해야 하므로 정적 자산보다 worker.js 가 항상 먼저 돈다.
run_worker_first = true
